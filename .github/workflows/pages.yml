# Publica la presentación en GitHub Pages en cada push a main.
# Requiere: Settings → Pages → Source: "GitHub Actions".
# Esta carpeta debe ser la raíz del repositorio.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Solo se publica lo que el navegador necesita (sin tools/, docs, etc.).
      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r index.html css js fonts vendor .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
